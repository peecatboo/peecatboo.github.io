<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG · Case Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@400;700&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    background: #0a0a0a;
    color: #fff;
    overflow: hidden;
  }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    padding: 80px 90px;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  .top {
    font-family: 'JetBrains Mono', Consolas, monospace;
    color: #00ff41;
    font-size: 20px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
  }
  .middle {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 24px;
  }
  .title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 80px;
    line-height: 1.05;
    letter-spacing: -0.02em;
    font-weight: 400;
    color: #fff;
  }
  .title .accent { color: #00ff41; }
  .subtitle {
    font-family: 'Playfair Display', Georgia, serif;
    font-style: italic;
    font-size: 32px;
    color: #888;
    letter-spacing: 0;
  }
  .bottom {
    font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 18px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #888;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .name { color: #00ff41; }
  .url { color: #fff; }
</style>
</head>
<body>
  <div class="top">↓ Case Study · 2026</div>
  <div class="middle">
    <div class="title">AI in<br><span class="accent">Instructional Design</span></div>
    <div class="subtitle">— A Workflow Case Study</div>
  </div>
  <div class="bottom">
    <div></div>
    <div><span class="name">Yusi Xu</span> &nbsp;·&nbsp; <span class="url">peecatboo.github.io/ai-workflow</span></div>
  </div>
</body>
</html>
