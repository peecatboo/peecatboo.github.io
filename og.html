<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@400;700&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    background: #0a0a0a;
    color: #fff;
    overflow: hidden;
  }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    padding: 80px 90px;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  .top {
    font-family: 'JetBrains Mono', Consolas, monospace;
    color: #00ff41;
    font-size: 20px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
  }
  .middle {
    flex: 1;
    display: flex;
    align-items: center;
  }
  .statements {
    display: flex;
    flex-direction: column;
    gap: 14px;
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 64px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    font-weight: 400;
    color: #fff;
  }
  .period { color: #00ff41; }
  .bottom {
    font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 18px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #888;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .name { color: #00ff41; }
  .url { color: #fff; }
  .year { color: #888; }
</style>
</head>
<body>
  <div class="top">↓ Portfolio</div>
  <div class="middle">
    <div class="statements">
      <div>Instructional design<span class="period">.</span></div>
      <div>AI-integrated production<span class="period">.</span></div>
      <div>Regulated healthcare<span class="period">.</span></div>
    </div>
  </div>
  <div class="bottom">
    <div class="year">2026</div>
    <div><span class="name">Yusi Xu</span> &nbsp;·&nbsp; <span class="url">peecatboo.github.io</span></div>
  </div>
</body>
</html>
